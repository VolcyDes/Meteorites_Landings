[project]
name = "meteorite-dashboard"
version = "1.0.0"
description = "Dashboard interactif d'analyse mondiale des chutes de météorites – Projet Python 2 ESIEE Paris"
requires-python = ">=3.10"
dependencies = [
    "dash>=2.18.2",
    "plotly>=5.24.1",
    "pandas>=2.2.3",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
